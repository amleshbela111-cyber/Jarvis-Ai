name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleRelease --no-daemon

      - name: Copy APK with a fixed name
        run: cp app/build/outputs/apk/release/app-release.apk JarvisAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-debug-apk
          path: JarvisAI.apk

      # Publishes the APK as a GitHub Release so Obtainium (or a browser) can download it directly.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" JarvisAI.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jarvis AI build ${{ github.run_number }}" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Install with Obtainium or download JarvisAI.apk." \
            --latest
