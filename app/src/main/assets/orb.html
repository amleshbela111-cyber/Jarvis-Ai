
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Energy Core</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030100;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"./three/three.module.js"
  }
}
</script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import {EffectComposer} from
"./three/jsm/postprocessing/EffectComposer.js";
import {RenderPass} from
"./three/jsm/postprocessing/RenderPass.js";
import {UnrealBloomPass} from
"./three/jsm/postprocessing/UnrealBloomPass.js";

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030100);

const camera=new THREE.PerspectiveCamera(
  38,innerWidth/innerHeight,.1,100
);
camera.position.z=6.3;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

// POSTPROCESSING
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const bloom=new UnrealBloomPass(
  new THREE.Vector2(innerWidth,innerHeight),
  1.05,.65,.18
);
composer.addPass(bloom);

// COLORS
const C={
  orange:0xA9430B,
  orangeDark:0x652407,
  orangeGlow:0xC65A12,
  gold:0x986019,
  core:0xA84C10,
  particle:0xA95A16
};

function material(color,opacity=1){
  return new THREE.MeshBasicMaterial({
    color,
    transparent:true,
    opacity,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    side:THREE.DoubleSide
  });
}

const orb=new THREE.Group();
scene.add(orb);

// CORE
const core=new THREE.Mesh(
  new THREE.SphereGeometry(.105,48,48),
  new THREE.MeshBasicMaterial({color:C.core})
);
orb.add(core);

// GLOW TEXTURE
function glowTexture(){
  const c=document.createElement("canvas");
  c.width=c.height=256;
  const ctx=c.getContext("2d");

  const g=ctx.createRadialGradient(
    128,128,0,128,128,128
  );

  g.addColorStop(0,"rgba(168,76,16,0.95)");
  g.addColorStop(.12,"rgba(166,67,11,0.82)");
  g.addColorStop(.28,"rgba(137,49,8,0.48)");
  g.addColorStop(.52,"rgba(101,36,7,0.2)");
  g.addColorStop(1,"rgba(30,8,0,0)");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,256,256);

  return new THREE.CanvasTexture(c);
}

function createGlow(size,opacity){
  const sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:glowTexture(),
      transparent:true,
      opacity,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  sprite.scale.set(size,size,1);
  orb.add(sprite);
  return sprite;
}

const coreGlow=createGlow(.8,.9);
const innerGlow=createGlow(1.65,.48);

// OUTER ORBITAL RINGS
const rings=[];

function makeRing(
  radius,tube,rotation,color,
  arc=Math.PI*2,speed=.1
){
  const mesh=new THREE.Mesh(
    new THREE.TorusGeometry(
      radius,tube,16,300,arc
    ),
    material(color,.95)
  );

  mesh.rotation.set(...rotation);
  mesh.userData.speed=speed;

  orb.add(mesh);
  rings.push(mesh);
}

makeRing(1.12,.018,[1.12,.25,.1],C.orangeGlow);
makeRing(1.28,.023,[.72,1,.4],C.gold);

makeRing(
  1.52,.027,[1.35,.4,.7],
  C.orange,Math.PI*1.52,.12
);

makeRing(
  1.62,.019,[.85,1.35,.15],
  C.gold,Math.PI*1.65,-.09
);

makeRing(
  1.38,.014,[1.6,.8,1],
  C.orangeDark,Math.PI*1.3,.16
);

// ==================================
// PERFECT SPHERICAL INNER WIREFRAME
// ==================================

const strandGroup=new THREE.Group();
orb.add(strandGroup);

const sphereRadius=.76;
const circleCount=24;

// Uniformly distributed great-circle directions
for(let i=0;i<circleCount;i++){

  const y=1-(i/(circleCount-1))*2;

  const radius=Math.sqrt(1-y*y);

  const theta=i*Math.PI*(3-Math.sqrt(5));

  const normal=new THREE.Vector3(
    Math.cos(theta)*radius,
    y,
    Math.sin(theta)*radius
  ).normalize();

  // Create two perpendicular vectors
  // to form a perfect circle in 3D space

  const reference=new THREE.Vector3(0,1,0);

  if(Math.abs(normal.dot(reference))>.95){
    reference.set(1,0,0);
  }

  const u=new THREE.Vector3()
    .crossVectors(normal,reference)
    .normalize();

  const v=new THREE.Vector3()
    .crossVectors(normal,u)
    .normalize();

  const points=[];
  const segments=240;

  for(let j=0;j<=segments;j++){

    const angle=(j/segments)*Math.PI*2;

    const point=new THREE.Vector3()
      .addScaledVector(u,
        sphereRadius*Math.cos(angle))
      .addScaledVector(v,
        sphereRadius*Math.sin(angle));

    points.push(point);
  }

  const curve=new THREE.CatmullRomCurve3(
    points,true,"centripetal"
  );

  const geometry=new THREE.TubeGeometry(
    curve,
    300,
    .0035,
    6,
    true
  );

  const lineColor=
    i%4===0 ? C.orangeGlow : C.gold;

  const mesh=new THREE.Mesh(
    geometry,
    material(lineColor,.85)
  );

  strandGroup.add(mesh);
}

// Additional circular latitude lines
// to enhance spherical geometry

for(let i=1;i<=7;i++){

  const latitude=(i/8)*Math.PI;

  const r=sphereRadius*Math.sin(latitude);
  const y=sphereRadius*Math.cos(latitude);

  const points=[];

  for(let j=0;j<=240;j++){

    const a=(j/240)*Math.PI*2;

    points.push(
      new THREE.Vector3(
        r*Math.cos(a),
        y,
        r*Math.sin(a)
      )
    );
  }

  const curve=new THREE.CatmullRomCurve3(
    points,true
  );

  const mesh=new THREE.Mesh(
    new THREE.TubeGeometry(
      curve,300,.0028,6,true
    ),
    material(C.orangeGlow,.72)
  );

  strandGroup.add(mesh);
}

// ==================================
// RADIAL BEAMS
// ==================================

const beams=new THREE.Group();
orb.add(beams);

for(let i=0;i<11;i++){

  const angle=i*Math.PI*2/11;
  const length=1.5+Math.random()*.35;

  const dir=new THREE.Vector3(
    Math.cos(angle),
    Math.sin(angle),
    (Math.random()-.5)*.5
  ).normalize();

  const curve=new THREE.CatmullRomCurve3([
    dir.clone().multiplyScalar(.1),
    dir.clone().multiplyScalar(length)
  ]);

  beams.add(new THREE.Mesh(
    new THREE.TubeGeometry(
      curve,32,.005,8,false
    ),
    material(i%2?C.orange:C.gold,.9)
  ));
}

// ==================================
// PARTICLES
// ==================================

const COUNT=5200;

const positions=new Float32Array(COUNT*3);
const particleData=[];

for(let i=0;i<COUNT;i++){

  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const radius=1.15+Math.random()*.78;

  particleData.push({
    theta,phi,radius,
    speed:.12+Math.random()*.65,
    phase:Math.random()*Math.PI*2,
    drift:(Math.random()-.5)*.16
  });

  positions[i*3]=
    radius*Math.sin(phi)*Math.cos(theta);

  positions[i*3+1]=
    radius*Math.sin(phi)*Math.sin(theta);

  positions[i*3+2]=
    radius*Math.cos(phi);
}

const particleGeometry=new THREE.BufferGeometry();

particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(positions,3)
);

const particleSystem=new THREE.Points(
  particleGeometry,
  new THREE.PointsMaterial({
    color:C.particle,
    size:.014,
    transparent:true,
    opacity:.88,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    sizeAttenuation:true
  })
);

orb.add(particleSystem);

// ==================================
// ANIMATION
// ==================================

const clock=new THREE.Clock();

function animateParticles(time){

  const p=particleGeometry.attributes.position.array;

  for(let i=0;i<COUNT;i++){

    const d=particleData[i];

    const theta=d.theta+time*d.speed*.32;

    const phi=d.phi+
      Math.sin(time*.4+d.phase)*d.drift;

    const r=d.radius+
      Math.sin(time*1.8+d.phase)*.025;

    p[i*3]=r*Math.sin(phi)*Math.cos(theta);

    p[i*3+1]=
      r*Math.sin(phi)*Math.sin(theta);

    p[i*3+2]=r*Math.cos(phi);
  }

  particleGeometry.attributes.position.needsUpdate=true;
}

// ==================================
// APP STATE (driven from Android)
// ==================================

let targetScale=1, curScale=1, curLevel=0, curState="IDLE";

// Called by the app: state name and mic level 0..1.
window.jarvisSetState=(s,l)=>{
  curState=s;
  curLevel=Math.max(0,Math.min(1,Number(l)||0));
  if(s==="SPEAKING") targetScale=1.35;
  else if(s==="LISTENING") targetScale=0.9+curLevel*0.25;
  else targetScale=1;
};

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  orb.rotation.y=t*.13;
  orb.rotation.x=Math.sin(t*.22)*.12;
  orb.rotation.z=Math.sin(t*.15)*.08;

  // Spherical wireframe rotation
  strandGroup.rotation.y=-t*.12;
  strandGroup.rotation.x=t*.08;
  strandGroup.rotation.z=t*.035;

  beams.rotation.y=t*.07;

  rings.forEach(r=>{
    r.rotation.z+=r.userData.speed*.001;
  });

  particleSystem.rotation.y=-t*.06;

  animateParticles(t);

  const pulse=1+Math.sin(t*2.1)*.05;

  core.scale.setScalar(pulse);

  coreGlow.scale.setScalar(.8*pulse);

  innerGlow.scale.setScalar(
    1.65+Math.sin(t*1.6)*.04
  );

  const speakPulse = curState==="SPEAKING" ? Math.sin(t*9)*0.04 : 0;
  curScale += (targetScale + speakPulse - curScale) * 0.08;
  orb.scale.setScalar(curScale);

  composer.render();
}

animate();

// ==================================
// RESIZE
// ==================================

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

  composer.setSize(innerWidth,innerHeight);
});

// ==================================
// TOUCH ROTATION
// ==================================

let dragging=false;
let px=0,py=0;
let downX=0,downY=0,moved=false;

renderer.domElement.addEventListener(
  "pointerdown",e=>{

    dragging=true;
    moved=false;

    px=e.clientX;
    py=e.clientY;
    downX=e.clientX;
    downY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointerup",e=>{
    const dist=Math.hypot(e.clientX-downX,e.clientY-downY);
    if(!moved && dist<8 && window.AndroidOrb){
      window.AndroidOrb.onTap();
    }
  }
);

addEventListener("pointerup",()=>{
  dragging=false;
});

renderer.domElement.addEventListener(
  "pointermove",e=>{

    if(!dragging)return;

    if(Math.hypot(e.clientX-downX,e.clientY-downY)>=8) moved=true;

    orb.rotation.y+=(e.clientX-px)*.004;

    orb.rotation.x+=(e.clientY-py)*.004;

    px=e.clientX;
    py=e.clientY;
  }
);

</script>
</body>
</html>
